<button 
  [class]="buttonClasses"
  [disabled]="disabled || loading"
  (click)="onClick($event)"
  type="button">
  <span *ngIf="loading" class="talento-button__spinner"></span>
  <span class="talento-button__content">
    <ng-content></ng-content>
    
  </span>
  <i class="i-document document-icon"></i>
    <!-- <i nz-icon nzType="eye" nzTheme="outline"></i> -->
    <!-- <i nz-icon nzType="download" nzTheme="outline"></i> -->
</button>
